[project]
name = "sceneweave"
version = "0.1.0"
description = "基于 Concordia 的事件驱动角色模拟"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "gdm-concordia>=2.4,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src/sceneweave"]

# Concordia 2.4.0 未发布 py.typed；仅跟随已核对的类型模块。
[[tool.mypy.overrides]]
module = [
    "concordia.typing.entity",
    "concordia.typing.entity_component",
    "concordia.typing.logging",
    "concordia.language_model.language_model",
    "concordia.utils.structured_logging",
    "concordia.environment.step_controller",
    "concordia.utils.simulation_server",
]
follow_untyped_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
